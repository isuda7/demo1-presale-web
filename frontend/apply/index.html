<!doctype html>
<html lang="ko" data-page="apply">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- @layout:head -->
    <link rel="stylesheet" href="/src/styles/base.css" />
  </head>
  <body>
    <!-- @layout:header -->
    <main id="main" class="page page--apply">
      <!-- @layout:title -->

      <section class="section apply-section">
        <div class="container apply-layout">
          <!-- 좌측: 안내 비주얼 (카탈로그 3쪽 외관 이미지·사업개요) -->
          <aside class="apply-visual" style="background-image: url('/images/catalog/exterior-river.jpg')">
            <div class="apply-visual__inner">
              <p class="eyebrow">HOBAN SUMMIT BROOKSIDE</p>
              <h2 class="apply-visual__title">관심고객 <em>등록</em></h2>
              <p class="apply-visual__lead">성함과 연락처를 남겨 주시면<br />분양 소식을 안내해 드립니다.</p>
              <dl class="apply-facts">
                <div><dt>대지위치</dt><dd>충청북도 청주시 동남택지개발지구 B-8BL</dd></div>
                <div><dt>공급규모</dt><dd>지하 2층 ~ 지상 25층, 14개동 1,215세대</dd></div>
                <div><dt>주택형</dt><dd>74㎡A · 74㎡B · 84㎡</dd></div>
              </dl>
            </div>
          </aside>

          <!-- 우측: 신청 폼 (필드는 shared/forms/apply.ts 로 생성 → 편집 대상 제외) -->
          <div class="apply-panel">
            <div class="apply-panel__head">
              <h3 class="apply-panel__title">등록 정보 입력</h3>
              <p class="apply-panel__desc"><span class="req" aria-hidden="true">*</span> 표시는 필수 입력 항목입니다.</p>
            </div>

            <div data-cms-skip>
              <!-- 마감 시 안내 -->
              <div id="apply-closed" class="apply-state apply-state--closed" role="status" hidden></div>
              <!-- 접수 완료/오류 안내 -->
              <div id="apply-result" class="apply-state" role="status" hidden></div>

              <form id="apply-form" class="apply-form" novalidate hidden>
                <div id="apply-fields"></div>
                <button type="submit">등록하기</button>
              </form>
              <noscript>관심고객 등록은 자바스크립트를 사용해야 합니다.</noscript>
            </div>
          </div>
        </div>
      </section>
    </main>
    <!-- @layout:footer -->
    <script type="module" src="/src/js/common.js"></script>
    <script type="module" src="/src/js/apply.js"></script>
  </body>
</html>
