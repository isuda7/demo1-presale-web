<!doctype html>
<html lang="ko" data-page="admin">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- @layout:head -->
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/admin.css" />
  </head>
  <body class="is-admin">
    <!-- @layout:header -->
    <main id="main" class="page page--admin">
      <!-- 로그인 -->
      <section id="admin-login" class="admin-login" hidden>
        <div class="admin-card">
          <p class="eyebrow">ADMIN</p>
          <h1 class="admin-card__title">관리자 로그인</h1>
          <form id="login-form">
            <div class="form-row">
              <label for="admin-password">비밀번호</label>
              <input id="admin-password" name="password" type="password" autocomplete="current-password" required />
            </div>
            <p id="login-error" class="form-error" role="alert"></p>
            <button class="btn btn--primary btn--block" type="submit">로그인</button>
          </form>
        </div>
      </section>

      <!-- 신청 목록 -->
      <section id="admin-list" class="admin-list" hidden>
        <div class="admin-container">
          <div class="admin-head">
            <div>
              <p class="eyebrow">APPLICATIONS</p>
              <h1 class="admin-head__title">관심고객 신청 관리</h1>
            </div>
            <div class="admin-head__actions">
              <a id="csv-link" class="btn btn--outline btn--sm" href="/api/admin/applications.csv">CSV 내려받기</a>
              <button id="logout-btn" class="btn btn--text btn--sm" type="button">로그아웃</button>
            </div>
          </div>

          <form id="filter-form" class="admin-filter" role="search">
            <div class="form-row admin-filter__q">
              <label for="filter-q">검색</label>
              <input id="filter-q" name="q" type="search" maxlength="100" placeholder="성함 · 연락처 · 문의사항" />
            </div>
            <div class="form-row">
              <label for="filter-status">상태</label>
              <select id="filter-status" name="status"></select>
            </div>
            <div class="form-row">
              <label for="filter-from">신청일 시작</label>
              <input id="filter-from" name="from" type="date" />
            </div>
            <div class="form-row">
              <label for="filter-to">신청일 종료</label>
              <input id="filter-to" name="to" type="date" />
            </div>
            <div class="admin-filter__buttons">
              <button class="btn btn--primary btn--sm" type="submit">조회</button>
              <button class="btn btn--outline btn--sm" type="reset">초기화</button>
            </div>
          </form>

          <p id="list-summary" class="admin-summary" role="status"></p>
          <div class="table-wrap">
            <table class="data-table admin-table">
              <thead>
                <tr>
                  <th scope="col">번호</th>
                  <th scope="col">신청일시</th>
                  <th scope="col">성함</th>
                  <th scope="col">연락처</th>
                  <th scope="col">문의사항</th>
                  <th scope="col">상태</th>
                  <th scope="col">관리</th>
                </tr>
              </thead>
              <tbody id="list-body"></tbody>
            </table>
          </div>
          <nav id="list-pager" class="admin-pager" aria-label="페이지"></nav>
        </div>
      </section>
    </main>
    <!-- @layout:footer -->
    <script type="module" src="/src/js/admin.js"></script>
  </body>
</html>
